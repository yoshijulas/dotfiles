[[mgr.prepend_keymap]]
on   = [",", "z"]
run  = ["sort size --reverse=no --dir-first=no", "linemode size"]
desc = "Sort by size (merged)"
[[mgr.prepend_keymap]]
on   = [",", "Z"]
run  = ["sort size --reverse=yes --dir-first=no", "linemode size"]
desc = "Sort by size (reverse merged)"
[[mgr.prepend_keymap]]
on   = [",", "s"]
run  = ["sort size --reverse=no --dir-first=yes", "linemode size"]
desc = "Sort by size"
[[mgr.prepend_keymap]]
on   = [",", "S"]
run  = ["sort size --reverse=yes --dir-first=yes", "linemode size"]
desc = "Sort by size (reverse)"

#diff.yazi
[[mgr.prepend_keymap]]
on   = "<C-d>"
run  = "plugin diff"
desc = "Diff the selected with the hovered file"

#mount.yazi
[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

#open-with-cmd.yazi
[[mgr.prepend_keymap]]
on   = "o"
run  = "plugin open-with-cmd -- block"
desc = "Open with command in the terminal"
[[mgr.prepend_keymap]]
on   = "O"
run  = "plugin open-with-cmd"
desc = "Open with command"

#bypass.yazi
[[mgr.prepend_keymap]]
on   = ["L"]
run  = "plugin bypass"
desc = "Recursively enter child directory, skipping children with only a single subdirectory"
[[mgr.prepend_keymap]]
on   = ["H"]
run  = "plugin bypass reverse"
desc = "Recursively enter parent directory, skipping parents with only a single subdirectory"
[[mgr.prepend_keymap]]
on   = "<S-Right>"
run  = "plugin bypass"
desc = "Recursively enter child directory, skipping children with only a single subdirectory"
[[mgr.prepend_keymap]]
on   = "<S-Left>"
run  = "plugin bypass reverse"
desc = "Recursively enter parent directory, skipping parents with only a single subdirectory"

#smart-filter.yazi
[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

#Custom Swayimg
[[mgr.prepend_keymap]]
on   = ["g", "i"]
run  = "plugin swayimg"
desc = "Open Swayimg Gallery Plugin"
[[mgr.prepend_keymap]]
on   = ["g", "I"]
run  = 'shell "swayimg -g ."'
desc = "Open Swayimg Gallery in separate window"

# eza-preview.yazi
[[mgr.prepend_keymap]]
on   = ["e", "t"]
run  = "plugin eza-preview"
desc = "Toggle tree/list dir preview"
[[mgr.prepend_keymap]]
on   = ["e", "-"]
run  = "plugin eza-preview inc-level"
desc = "Increment tree level"
[[mgr.prepend_keymap]]
on   = ["e", "_"]
run  = "plugin eza-preview dec-level"
desc = "Decrement tree level"
[[mgr.prepend_keymap]]
on   = ["e", "$"]
run  = "plugin eza-preview toggle-follow-symlinks"
desc = "Toggle tree follow symlinks"
[[mgr.prepend_keymap]]
on   = ["e", "*"]
run  = "plugin eza-preview toggle-hidden"
desc = "Toggle hidden files"
[[mgr.prepend_keymap]]
on   = ["e", "g", "i"]
run  = "plugin eza-preview toggle-git-ignore"
desc = "Toggle .gitignore files"
[[mgr.prepend_keymap]]
on   = ["e", "g", "s"]
run  = "plugin eza-preview toggle-git-status"
desc = "Toggle showing git status"

# chmod.yazi
[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

#custom
[[mgr.prepend_keymap]]
on   = "z"
run  = "plugin fzf"
desc = "Jump to a file or directory via fzf"
