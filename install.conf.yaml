- defaults:
    link:
      relink: true

- clean: ["~"]

- clean:
    ~/:
      # force: true
    ~/.config:
      recursive: true

# Windows-specific links
- defaults:
    link:
      if: "ver"
      create: true
    shell:
      if: "ver"
- link:
    ~/.bunfig.toml: universal/bunfig.toml
    ~/.config/starship.toml: universal/starship/starship.toml
    ~/AppData/Local/lazygit: universal/lazygit
    ~/AppData/Local/nvim: universal/nvim
    ~/AppData/Local/rio: universal/rio
    ~/AppData/Roaming/rustfmt/rustfmt.toml: universal/rustfmt/rustfmt.toml
    ~/AppData/Roaming/topgrade.toml: universal/topgrade.toml
    ~/AppData/Roaming/yazi/config: universal/yazi
    ~/Documents/PowerShell/Microsoft.PowerShell_profile.ps1: windows/PowerShell/Microsoft.PowerShell_profile.ps1
- shell:
    - command: 'powershell -ExecutionPolicy Bypass -File "windows/install-scoop-packages.ps1"'
      description: "Installing Windows packages via Scoop"

# Linux-specific links
- defaults:
    link:
      if: '[ "$(uname)" = "Linux" ]'
      create: true
- link:
    ~/.bunfig.toml: universal/bunfig.toml
    ~/.config/btop: linux/btop
    ~/.config/feh/themes: linux/feh/themes
    ~/.config/foot: linux/foot
    ~/.config/lazygit: universal/lazygit
    ~/.config/MangoHud: linux/MangoHud
    ~/.config/mimeapps.list: linux/mimeapps.list
    ~/.config/niri: linux/niri
    ~/.config/nvim: universal/nvim
    ~/.config/rio: universal/rio
    ~/.config/rustfmt/rustfmt.toml: universal/rustfmt/rustfmt.toml
    ~/.config/starship.toml: universal/starship/starship.toml
    ~/.config/swayimg: linux/swayimg
    ~/.config/topgrade.toml: universal/topgrade.toml
    ~/.config/yazi: universal/yazi
    ~/.config/zathura: linux/zathura
    ~/.zshrc: linux/.zshrc
    # Not used anymore
    # ~/.config/hypr: linux/hypr
    # ~/.config/rofi: linux/rofi
    # ~/.config/swaync: linux/swaync
    # ~/.config/waybar: linux/waybar
    # ~/.config/xkb/symbols/latam_prog: linux/keyboard/latam_prog

- shell:
    - [git submodule update --init --recursive, Installing submodules]
